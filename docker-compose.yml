# Play Shop Tek - entorno de desarrollo
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playshoptek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playshoptek}
      POSTGRES_DB: ${POSTGRES_DB:-playshoptek}
    ports:
      - "5433:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playshoptek}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-playshoptek}:${POSTGRES_PASSWORD:-playshoptek}@db:5432/${POSTGRES_DB:-playshoptek}
      WATCHFILES_FORCE_POLLING: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  datos_db: