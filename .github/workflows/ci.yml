# Integración continua: en cada push o pull request GitHub prueba que todo funcione.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: playshoptek
          POSTGRES_PASSWORD: playshoptek
          POSTGRES_DB: playshoptek
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U playshoptek" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://playshoptek:playshoptek@localhost:5432/playshoptek
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m app.seed
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build